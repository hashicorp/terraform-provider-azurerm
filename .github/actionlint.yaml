---
# Config for rhysd/actionlint (run by workflows/workflow-actionlint.yml / make actionlint).
self-hosted-runner:
  # Custom runner labels used by this repo's workflows.
  labels:
    - custom-linux-small
    - custom-linux-large
    - custom-linux-xl
    - custom-ubuntu-22.04-medium

# No config variables are used; an empty list makes any ${{ vars.X }} an error.
config-variables: []
