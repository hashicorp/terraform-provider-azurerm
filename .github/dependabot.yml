version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # the provider's own dependencies. Security updates are not scheduled as dependabot opens a PR as soon as an advisory lands.
  # Routine version bumps only arrive quarterly, batched into one PR.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "github.com/Azure/azure-sdk-for-go"

  # go dev tools (golangci-lint, terrafmt, gofumpt, ...) pinned in .tools/go.mod, built by make into .tools/bin;
  # tools should move slowly so only check quarterly
  - package-ecosystem: "gomod"
    directory: "/.tools"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns:
          - "*"
