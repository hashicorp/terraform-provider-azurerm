version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # the provider's own dependencies. Security updates are not scheduled: dependabot opens a PR as
  # soon as an advisory lands, regardless of this interval. Routine version bumps (go-azure-sdk and
  # friends) only arrive quarterly, batched into one PR. Dependabot detects vendor/ and runs
  # `go mod tidy` + `go mod vendor` on updates.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns:
          - "*"

  # go dev tools (golangci-lint, terrafmt, gofumpt, ...) pinned in .tools/go.mod, built by make
  # into .tools/bin; tools should move slowly so only check quarterly
  - package-ecosystem: "gomod"
    directory: "/.tools"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns:
          - "*"
