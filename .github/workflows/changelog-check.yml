name: changelog-check

on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "labeled"
      - "unlabeled"
    branches:
      - "main"

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .go-version

      - name: Cache changeloggy
        id: cache-changeloggy
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/bin/changeloggy
          key: changeloggy-${{ runner.os }}-v0.1.0

      - name: Install changeloggy
        if: steps.cache-changeloggy.outputs.cache-hit != 'true'
        run: go install github.com/sreallymatt/changeloggy@v0.1.0

      - name: Check changelog entry
        if: "!contains(github.event.pull_request.labels.*.name, 'no-changelog-needed')"
        id: check
        run: changeloggy check --pr ${{ github.event.pull_request.number }}

      - name: Save PR number
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p artifacts
          echo "$PR_NUMBER" > artifacts/pr-number

      - name: Save types table on failure
        if: failure() && steps.check.outcome == 'failure'
        run: changeloggy types > artifacts/types-table

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: changelog-check-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/
