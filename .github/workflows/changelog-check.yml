name: changelog-check

on:
  pull_request:
    types:
      - "synchronize"
      - "labeled"
      - "unlabeled"
    branches:
      - "main"

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: .go-version

      - name: Cache changeloggy
        id: cache-changeloggy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin/changeloggy
          key: changeloggy-${{ runner.os }}-${{ hashFiles('.tools/go.mod', '.tools/go.sum') }}

      - name: Install changeloggy
        if: steps.cache-changeloggy.outputs.cache-hit != 'true'
        run: make .tools/bin/changeloggy

      - name: Add changeloggy to PATH
        run: echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Check changelog entry
        if: |
          !contains(github.event.pull_request.labels.*.name, 'no-changelog-needed') &&
          !contains(github.event.pull_request.labels.*.name, 'github_actions')
        id: check
        run: changeloggy check --pr ${{ github.event.pull_request.number }}

      - name: Save metadata
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          mkdir -p artifacts
          echo "$PR_NUMBER" > artifacts/pr-number
          echo "$AUTHOR_ASSOCIATION" > artifacts/author-association

      - name: Save types table on failure
        if: failure() && steps.check.outcome == 'failure'
        run: changeloggy types --table > artifacts/types-table

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: changelog-check-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/
