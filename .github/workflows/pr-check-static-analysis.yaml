---
name: Static Analysis

# Standalone PR check (custom runner): scripts/checks/static-analysis.sh looks for
# code patterns that indicate bugs or deviations from project conventions.
# Display name is matched by the workflow_run list in pr-waiting-response-on-ci-fail.yaml.

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/pr-check-static-analysis.yaml'
      - 'vendor/**'
      - 'internal/**.go'

concurrency:
  group: 'staticAnalysys-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  detect:
    runs-on: custom-linux-small
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: bash ./scripts/checks/static-analysis.sh
      - name: Guidance on failure
        if: failure()
        run: |
          echo "::error::Static Analysis failed."
          echo ""
          echo "Run 'bash ./scripts/checks/static-analysis.sh' locally to reproduce."
          echo "This check looks for common code patterns that may indicate bugs or"
          echo "deviations from project conventions."

  save-artifacts-on-fail:
    needs: detect
    if: ${{ failure() }}
    uses: ./.github/workflows/pr-save-artifacts.yaml
