---
name: Schema Lint

permissions:
  contents: read
  pull-requests: read

# Two independent checks run on pull requests that touch resource or data source
# schemas under internal/services/:
#
#   * check — lints entirely new resources / data sources (files added in the PR),
#     scoped to the new type name(s).
#   * diff  — lints only the schema PROPERTIES a PR adds, relative to the base
#     branch it is merging into, so pre-existing properties (which cannot be
#     renamed, as that would be a breaking change) are ignored.
#
# Both jobs are skipped when a maintainer applies the "schema-accepted" label.
on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/schema-lint.yaml'
      - 'scripts/run-schema-lint.sh'
      - 'scripts/run-schema-lint-diff.sh'
      - 'internal/services/**/*_resource.go'
      - 'internal/services/**/*_data_source.go'
      - 'internal/services/**/*_datasource.go'

concurrency:
  group: 'schema-lint-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    # Skip when a maintainer has accepted the schema by applying the
    # "schema-accepted" label to the pull request.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'schema-accepted') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history so the base branch can be checked out in a worktree.
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: bash ./scripts/run-schema-lint-diff.sh
      - name: Guidance on failure
        if: failure()
        run: |
          echo "::error::Schema lint failed for a newly added schema property."
          echo ""
          echo "This PR adds one or more schema properties that violate a"
          echo "schema-lint rule. Only NEWLY ADDED properties are checked"
          echo ""
          echo "Reproduce locally against the branch you are merging into:"
          echo "  GITHUB_BASE_REF=main bash ./scripts/run-schema-lint-diff.sh"
          echo ""
          echo "See internal/tools/schema-lint/README.md for the full rule list."
