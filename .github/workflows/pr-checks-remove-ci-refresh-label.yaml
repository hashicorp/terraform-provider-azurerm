---
name: Remove CI Refresh Label

# Removes the 'ci-refresh' trigger label once applied, so it behaves like a
# button rather than a sticky status. The label re-runs the pr-check workflows
# against a fresh merge with the base branch (see pr-checks-combined.yaml);
# those checks run from the same labeled event snapshot regardless of this
# removal, so there is no race with removing it immediately.

permissions:
  pull-requests: write

on:
  pull_request:
    types: ['labeled']

jobs:
  remove-ci-refresh-label:
    if: github.event.label.name == 'ci-refresh'
    runs-on: ubuntu-latest
    steps:
      - name: remove the ci-refresh label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label ci-refresh
