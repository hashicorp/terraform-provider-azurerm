name: Markdown Lint

# markdownlint over the repo's markdown (website docs, README, contributing, .github).
# Link checking is separate: pr-check-links-local.yaml (internal, PRs) and
# main-check-links.yaml (external, pushes to main).

permissions:
  contents: read

on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - 'website/docs/**'
      - 'README.md'
      - 'contributing/**'
      - '.github/**/*.md'
      - '.markdownlint.yml'
      - '.github/workflows/pr-check-markdown.yaml'
      - 'GNUmakefile'

concurrency:
  group: 'pr-check-markdown-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      # make npm installs the markdownlint-cli2 version pinned in GNUmakefile into .tools
      - run: make markdownlint
