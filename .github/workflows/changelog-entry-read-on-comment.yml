name: changelog-entry-read-on-comment

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  deny-comment:
    # TODO: decide whether to allow author of PR to run /changelog
    # github.event.comment.user.login != github.event.issue.user.login
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/changelog') &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment on unauthorized use
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "warning",
            })

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `@${context.payload.comment.user.login} Only repository maintainers can manage changelog entries.`,
            })

  save-comment:
    # TODO: consider allowing author:
    #      (
    #        github.event.comment.user.login == github.event.issue.user.login ||
    #        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    #      )
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/changelog') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Acknowledge comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            })

      - name: Save event metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs')
            const body = context.payload.comment.body
            const prNumber = context.payload.issue.number
            const replace = body.startsWith('/changelog replace')
            fs.mkdirSync('artifacts', { recursive: true })
            fs.writeFileSync('artifacts/pr-number', String(prNumber) + '\n')
            fs.writeFileSync('artifacts/comment-body', body.slice(0, 2048) + '\n')
            fs.writeFileSync('artifacts/replace', String(replace) + '\n')

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changelog-${{ github.event.issue.number }}-${{ github.run_id }}
          path: artifacts/
