---
name: Issue Opened Triage

# Auto-labels newly opened issues using the title/body regexes in
# .github/labeler-issue-triage.yml (hand-maintained) and
# .github/labeler-issue-triage-generated.yml (service labels, via 'make generate').

permissions:
  issues: write

on:
  issues:
    types: [opened]

jobs:
  issue_triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler-issue-triage.yml
          enable-versioned-regex: 0
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler-issue-triage-generated.yml
          enable-versioned-regex: 0
