---
name: PR Label Type

# Labels new/edited PRs by type using the title regexes in
# .github/labeler-pull-request-triage-type.yml.

permissions:
  pull-requests: write

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  pr_triage_label_type:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        continue-on-error: true
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler-pull-request-triage-type.yml
          enable-versioned-regex: 0
