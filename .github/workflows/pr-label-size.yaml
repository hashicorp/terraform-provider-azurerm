---
name: PR Label Size

# Labels PRs by diff size (size/XS through size/XL) and by touched paths
# (.github/labeler-pull-request-triage.yml).

permissions:
  pull-requests: write
  issues: write

# pull_request_target is used to label only; the PR head is never checked out
on: [pull_request_target]  # zizmor: ignore[dangerous-triggers]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler-pull-request-triage.yml
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
      - uses: CodelyTV/pr-size-labeler@e1869bf36de18c36cd132495c39f53c135b689a3 # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: '30'
          s_label: 'size/S'
          s_max_size: '60'
          m_label: 'size/M'
          m_max_size: '150'
          l_label: 'size/L'
          l_max_size: '300'
          xl_label: 'size/XL'
          message_if_xl: ''
          files_to_ignore: |
            "vendor/*"
            "go.mod"
