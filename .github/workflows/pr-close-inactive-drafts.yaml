name: 'Close Inactive Draft PRs'

# Scheduled housekeeping (Mondays): runs scripts/automation/pr-close-inactive-drafts.sh
# to close draft PRs with no recent activity.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * MON'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-draft-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false
      - name: Process stale draft PRs
        run: ./scripts/automation/pr-close-inactive-drafts.sh -o "${{ github.repository_owner }}" -r "${GITHUB_EVENT_REPOSITORY_NAME}" -t "${{ secrets.GITHUB_TOKEN }}"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
