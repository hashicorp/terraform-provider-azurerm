name: Workflow Action Lint

# Lints .github/workflows/ with actionlint (expression/context errors, shellcheck on run:
# blocks, action input validation). make builds actionlint at the version pinned in .tools/go.mod
# (a separate module, so its dependencies stay out of vendor/; dependabot bumps it there); its
# config lives in .github/actionlint.yaml.
#
# We build katbyte/actionlint, a fork of rhysd/actionlint carrying two upstream PRs that have not
# been merged: #732 (support for GitHub's `$/` self-repository `uses:` syntax, without which this
# repo's workflows fail to lint) and #735 (go.yaml.in/yaml/v4 rc.6, so actionlint and golangci-lint
# can share a dependency). Upstream has had no commits since April 2026.

permissions:
  contents: read

on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/**'
      - '.github/actionlint*'
      - '.tools/**'
      - 'GNUmakefile'

concurrency:
  group: 'workflow-actionlint-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  workflow-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
          cache: false
      # the problem matcher turns actionlint's file:line:col output into inline PR annotations
      - name: Register actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"
      - name: Run actionlint (with shellcheck) on workflow files (builds the pinned actionlint first)
        run: make actionlint
