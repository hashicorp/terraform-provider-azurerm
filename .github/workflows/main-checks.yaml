---
name: Main Branch Checks

# Runs the tree-state CI checks on every push to main (and release branches).
# PR checks only run on pull_request events, so without this workflow a merge to
# main is never validated: two PRs that are each green in isolation can still
# break main when combined (semantic merge conflicts, a renamed helper another
# PR started using, etc.).
#
# This intentionally duplicates the check jobs in pr-checks-combined.yaml (and
# the tree-based standalone pr-check-* workflows) rather than adding a push
# trigger to them: those workflows feed the PR comment/labeling machinery
# (pr-save-artifacts.yaml -> workflow_run watchers matched by display name),
# which has no PR to act on for a push event. Keep the check steps here in sync
# with their PR counterparts when updating either side.
#
# Diff-based PR checks (Breaking-change gating advice, gradually-deprecated,
# list-resource enforcement, guide suggestions) compare against origin/main and
# are meaningless on main itself, so they are not run here. The OIDC provider
# acceptance tests are also excluded — nightly TeamCity runs cover main.
# quick-checks, tfproviderlint, static-analysis and breaking-change detection
# are also deliberately absent: those checks are planned to consolidate into
# azproviderlint, which can be added here once it exists.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**

concurrency:
  # Only the newest push per branch matters — the tip includes earlier merges.
  group: 'main-checks-${{ github.ref }}'
  cancel-in-progress: true

jobs:

  # Unlike the PR workflow there is no fail-fast phasing here: on main we want
  # the complete picture of everything broken in one run, not saved runner time.
  paths-filter:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.website }}
      go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go }}
      scripts: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.scripts }}
      examples: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.examples }}
      vendor: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.vendor }}
      teamcity: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.teamcity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        if: github.event_name == 'push'
        with:
          # base == the pushed branch, so changes are detected against the
          # commit range of the push itself (event.before..event.after).
          base: ${{ github.ref_name }}
          filters: |
            website:
              - 'website/**'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.go-version'
            scripts:
              - 'scripts/**'
              - '**/*.sh'
            examples:
              - 'examples/**'
            vendor:
              - 'vendor/**'
              - 'go.mod'
              - 'go.sum'
            teamcity:
              - '.teamcity/**'

  build:
    needs: paths-filter
    if: needs.paths-filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - name: Build Provider
        run: go build -v -o /dev/null main.go

  depscheck:
    needs: paths-filter
    if: needs.paths-filter.outputs.vendor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: make depscheck

  golangci-lint:
    needs: paths-filter
    if: needs.paths-filter.outputs.go == 'true'
    runs-on: custom-linux-large
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: 'v2.12.2'
          args: ./...

  gencheck:
    needs: paths-filter
    if: needs.paths-filter.outputs.go == 'true'
    runs-on: custom-linux-large
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: make gencheck

  unit-tests:
    needs: paths-filter
    if: needs.paths-filter.outputs.go == 'true'
    runs-on: custom-linux-xl
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache-dependency-path: go.mod
          go-version-file: ./.go-version
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Run tests
        run: |
          gotestsum \
           --format pkgname-and-test-fails \
           --format-hide-empty-pkg -- \
           -timeout=30s \
           -parallel=32 \
           -run='^Test[^A]|^TestA[^c]|^TestAc[^c]' \
           ./...

  preview-api-version-linter:
    needs: paths-filter
    if: needs.paths-filter.outputs.vendor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: go run internal/tools/preview-api-version-linter/main.go

  shellcheck:
    needs: paths-filter
    if: needs.paths-filter.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - name: Run ShellCheck
        run: make shellcheck

  website-lint:
    needs: paths-filter
    if: needs.paths-filter.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: make tools
      - run: make website-lint

  document-validate:
    needs: paths-filter
    if: needs.paths-filter.outputs.go == 'true' || needs.paths-filter.outputs.website == 'true'
    runs-on: custom-linux-large
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: make document-validate

  validate-examples:
    needs: paths-filter
    if: needs.paths-filter.outputs.examples == 'true'
    runs-on: custom-linux-small
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: make tools
      - run: make validate-examples

  teamcity-test:
    needs: paths-filter
    if: needs.paths-filter.outputs.teamcity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 17
          java-package: jdk
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - run: make teamcity-test
