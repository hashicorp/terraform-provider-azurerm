---
name: Link Milestone

# When a PR merges to main, assigns it and all issues it closes to the next
# unreleased milestone via scripts/automation/milestone-link.sh.

permissions: {}

# pull_request_target is used to label only; the PR head is never checked out
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [main]
    types: ['closed']

jobs:
  link-milestone:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # pull_request_target checks out the base branch (main), not the PR head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: "Link Milestone"
        shell: bash
        run: bash ./scripts/automation/milestone-link.sh
        env:
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
