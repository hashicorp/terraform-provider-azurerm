---
name: Preview ARM API Version Linter

# Standalone PR check: fails when changes reference preview (non-GA) ARM API
# versions (internal/tools/preview-api-version-linter).
# Display name is matched by the workflow_run list in pr-waiting-response-on-ci-fail.yaml.

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - ".github/workflows/pr-check-preview-api-version.yaml"
      - "internal/tools/preview-api-version-linter/**"
      - "vendor/**"

jobs:
  preview-api-version-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./.go-version
      - run: go run internal/tools/preview-api-version-linter/main.go
      - name: Guidance on failure
        if: failure()
        run: |
          echo "::error::Preview API Version Linter failed."
          echo ""
          echo "Your changes reference Azure ARM API versions that are in preview."
          echo "Preview API versions should not be used unless explicitly required and approved."
          echo "Please update the API version references to use GA (stable) versions."
  comment-on-fail:
    needs: preview-api-version-linter
    if: ${{ failure() }}
    uses: ./.github/workflows/pr-comment-failure.yaml
  comment-outdated-on-pass:
    needs: preview-api-version-linter
    if: ${{ success() }}
    uses: ./.github/workflows/pr-comment-failure-outdated.yaml

  save-artifacts-on-fail:
    needs: preview-api-version-linter
    if: ${{ failure() }}
    uses: ./.github/workflows/pr-save-artifacts.yaml
