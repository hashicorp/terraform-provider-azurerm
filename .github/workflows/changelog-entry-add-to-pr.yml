name: changelog-entry-add-to-pr

# The entry is written and pushed by two different jobs, so the token that can push is never on a runner beside the pull request's files:
# write-entry has the files and no such token, and hands its commit to push-entry, which has the token and checks out none of them.
# Tested by scripts/automation/changelog-entry-push.test.sh, as a workflow_run workflow only runs once it is on main.

# workflow_run is needed for write access on fork PRs, which pull_request cannot provide
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - changelog-entry-read-on-comment
    types:
      - completed

permissions: {}

jobs:
  write-entry:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      has-entry: ${{ steps.commit.outputs.has-entry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download event metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Validate PR number
        id: meta
        run: |
          IFS= read -r pr_number < artifacts/pr-number
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid pr-number" >&2
            exit 1
          fi
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          IFS= read -r replace < artifacts/replace
          echo "replace=$replace" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: .go-version

      - name: Cache changeloggy
        id: cache-changeloggy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/changeloggy
          key: changeloggy-${{ runner.os }}-${{ hashFiles('.tools/go.mod', '.tools/go.sum') }}

      - name: Install changeloggy
        if: steps.cache-changeloggy.outputs.cache-hit != 'true'
        run: make .tools/bin/changeloggy

      - name: Add changeloggy to PATH
        # a constant path, not untrusted input
        run: echo "$PWD/.tools/bin" >> "$GITHUB_PATH"  # zizmor: ignore[github-env]

      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Parse and add changelog entries
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
          REPLACE: ${{ steps.meta.outputs.replace }}
        run: |
          replace_flag=""
          [[ "$REPLACE" == "true" ]] && replace_flag="--replace"
          count=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [[ -z "$line" ]] && continue
            if [[ "$line" =~ ^\[([^\]]+)\]\ (.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              body="${BASH_REMATCH[2]}"
              count=$(( count + 1 ))
              if (( count > 10 )); then
                echo "Maximum of 10 entries exceeded, ignoring remainder" >&2
                break
              fi
              changeloggy add --pr "$PR_NUMBER" --type "$type" $replace_flag "$body"
              replace_flag=""
            fi
          done < <(tail -n +2 artifacts/comment-body)

          if (( count == 0 )); then
            echo "::error::No changelog entries found. Add at least one entry in the format '[type] description' on a new line after /changelog."
            exit 1
          fi

      # the commit goes on a branch with a fixed name, as the pull request's own branch name is chosen by its author
      - name: Commit changelog entries and bundle the commit
        id: commit
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
        run: |
          pr_head=$(git rev-parse HEAD)
          git switch --quiet -C changelog-entry
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changelog/

          if git diff --cached --quiet; then
            echo "has-entry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --quiet -m "changelog: add entries for PR #${PR_NUMBER}"
          git bundle create "${RUNNER_TEMP}/changelog-entry.bundle" "${pr_head}..refs/heads/changelog-entry"
          echo "has-entry=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.commit.outputs.has-entry == 'true'
        with:
          name: changelog-entry-bundle
          path: ${{ runner.temp }}/changelog-entry.bundle
          retention-days: 1

  push-entry:
    needs: write-entry
    if: needs.write-entry.outputs.has-entry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # main, for the script below: nothing from the pull request is checked out in this job
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/automation

      # the pull request number is read again from the comment's own run, not taken from the job that had the pull request's files
      - name: Download event metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Download the bundled commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: changelog-entry-bundle
          path: ${{ runner.temp }}

      - name: Check the commit and push it to the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.SERVICE_ACCOUNT_CHANGELOG_TOKEN }}
          BUNDLE_PATH: ${{ runner.temp }}/changelog-entry.bundle
          FETCH_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          IFS= read -r PR_NUMBER < artifacts/pr-number
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pr-number" >&2
            exit 1
          fi

          # where the pull request's branch lives, which is a fork for a pull request from a fork
          head_repo=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepositoryOwner,headRepository --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name)"')
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')

          export PR_NUMBER HEAD_REF
          export PUSH_URL="${GITHUB_SERVER_URL}/${head_repo}.git"
          ./scripts/automation/changelog-entry-push.sh

  comment-on-failure:
    needs: [write-entry, push-entry]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download event metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Comment on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = parseInt(require('fs').readFileSync('artifacts/pr-number', 'utf8').trim())
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `Failed to add changelog entries. [View run](${runUrl})`,
            })
