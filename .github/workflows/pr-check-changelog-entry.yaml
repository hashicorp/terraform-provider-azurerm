---
name: Changelog Entry

# Standalone PR check: validates that a changelog entry exists unless the 'no-changelog-needed' label is applied.

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: ['opened', 'synchronize', 'labeled', 'unlabeled']

concurrency:
  group: 'changelog-entry-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog-needed') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .go-version
      - name: Install changeloggy
        run: go install github.com/sreallymatt/changeloggy@v0.1.0
      - name: Check changelog entry
        id: check
        run: changeloggy check --pr ${{ github.event.pull_request.number }}
      - name: Post comment on failure
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require('child_process');
            const types = execSync('changeloggy types').toString();
            const prNumber = ${{ github.event.pull_request.number }};
            const body = `A changelog entry for this PR is missing or invalid. Please add one using:

            \`\`\`
            changeloggy add --pr ${{ github.event.pull_request.number }} --type <type> '<body>'
            \`\`\`

            Available types:

            ${types}

            ---

            If this PR does not need a changelog entry, ask a maintainer to apply the \`no-changelog-needed\` label.`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

  save-artifacts-on-fail:
    needs: check
    if: ${{ failure() }}
    uses: ./.github/workflows/pr-save-artifacts.yaml

  comment-on-fail:
    needs: check
    if: ${{ failure() }}
    uses: ./.github/workflows/pr-comment-failure.yaml

  comment-outdated-on-pass:
    needs: check
    if: ${{ success() }}
    uses: ./.github/workflows/pr-comment-failure-outdated.yaml
