name: 'Close PRs With Failing CI'

# Scheduled housekeeping (Mon/Wed/Fri): runs scripts/automation/pr-close-failing-ci.sh
# to close PRs whose CI has been left failing.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * MON,WED,FRI'

permissions:
  issues: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  close-failing-ci-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false
      - name: Process PRs with failing CI
        run: ./scripts/automation/pr-close-failing-ci.sh -o "${{ github.repository_owner }}" -r "${GITHUB_EVENT_REPOSITORY_NAME}" -t "${{ secrets.GITHUB_TOKEN }}" -l
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
