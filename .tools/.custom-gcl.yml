# Config for `golangci-lint custom`, which builds golangci-lint with the azproviderlint and
# tfproviderlint module plugins compiled in (make builds it as .tools/bin/golangci-with-modules;
# used by make lint). The version here must match the golangci-lint pin in go.mod - depscheck
# enforces this.
version: v2.12.2
name: golangci-with-modules
destination: ./bin
plugins:
  - module: "github.com/katbyte/azproviderlint"
    import: "github.com/katbyte/azproviderlint/plugin"
    version: v0.8.0
  - module: "github.com/katbyte/tfproviderlint-golangci"
    import: "github.com/katbyte/tfproviderlint-golangci/plugin"
    version: v0.31.0
