# NOTE: this config enables the azproviderlint and tfproviderlint module plugins, which only
# exist in the custom-built binary produced by 'make golangci-with-modules' (see
# scripts/.custom-gcl.yml) — run lints via 'make lint' / './scripts/golangci-with-modules run',
# not stock golangci-lint.
version: "2"
run:
  modules-download-mode: vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - azproviderlint
    - bidichk
    - decorder
    - dupword
    - durationcheck
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - predeclared
    - reassign
    - staticcheck
    - tagalign
    - tfproviderlint
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor$
      - internal/services/.*/.*_gen.go$
      - /sdk/
      - third_party$
      - builtin$
      - examples$

  settings:
    errcheck:
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).ForceNew
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNew
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNewComputed
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
        - io.Close
    govet:
      enable:
        - nilness
    misspell:
      ignore-rules:
        - hdinsight
        - exportfs
    nakedret:
      max-func-lines: 30
    predeclared:
      ignore:
        - new
        - min
        - max
    tagalign:
      sort: true
      order:
        - json
        - tfschema
        - computed

    custom:
      azproviderlint:
        type: module
        settings:
          disable:
            - AZR002 # splite create and udpate: ~350 todo over time
            - AZT002 #tests should not obtain credentials via os.Getenv - investigate in a later pr
            - AZR004 #Resource IDs should not be compared with == or != - to fix in a later commit
            - AZR003 # d.Get should not be used within a Delete function as it does not work as expected during deletion
      tfproviderlint:
        type: module
        settings:
          # All checks (including the tfproviderlintx X* checks, via extended) run except
          # those disabled below: permanent azurerm convention conflicts, and checks with
          # pre-existing findings (counts from 2026-08) disabled until the findings are
          # cleaned up — to enable one, remove it from this list and fix what
          # 'make tfproviderlint' then reports. The upstream-removed no-op stubs
          # (R008, S034, V002-V008) are not worth listing.
          extended: true
          disable:
            - AT002 # flags ImportState tests as extraneous, but azurerm intentionally has separate _requiresImport acceptance tests
            - AT004 # flags TestStep Configs declaring provider blocks, but azurerm test configs intentionally declare provider "azurerm" { features {} }
            - R009 # avoid panic() — 27 findings, mostly intentional panics in internal/tools generators and the internal/acceptance test framework
            - R018 # prefer retry/wait helpers over time.Sleep() — 28 findings, many deliberate PreConfig waits in acceptance tests
            - V001 # custom validators replaceable with validation.StringMatch() — 196 findings
            - V011 # custom validators replaceable with validation.StringLenBetween() — 43 findings
            - V012 # custom validators replaceable with validation.IntAtLeast()/IntAtMost()/IntBetween() — 16 findings
            - V013 # custom validators replaceable with validation.StringInSlice()/StringNotInSlice() — 20 findings
            - XR005 # resources should configure Description — azurerm does not use schema descriptions (docs are hand-written)
            - XR007 # avoid os/exec.Command() — 9 findings, all intentional uses in the internal/tools generators
            - XS001 # schema attributes should configure Description — azurerm does not use schema descriptions (docs are hand-written)
            - XS002 # schema attributes should be listed alphabetically — azurerm orders schemas required/optional/computed by convention
          flags:
            - check: AT001
              flag: ignored-filename-suffixes
              value: _data_source_test.go
            - check: R006
              flag: package-aliases
              value: pluginsdk

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    # gci merges blank-line-separated import groups into canonical sections
    # (stdlib, side-effect imports, then everything else) - goimports alone preserves
    # existing groups. Side-effect (`_`) imports get their own section as they carry
    # explanatory comments, which goimports requires a blank line in front of.
    gci:
      sections:
        - standard
        - blank
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - vendor$
      - internal/services/.*/.*_gen.go$
      - /sdk/
      - third_party$
      - builtin$
      - examples$
