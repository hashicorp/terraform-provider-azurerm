# NOTE: this config enables the azproviderlint and tfproviderlint module plugins, which only
# exist in the custom-built binary produced by 'make golangci-with-modules' (see
# scripts/.custom-gcl.yml) — run lints via 'make lint' / './scripts/golangci-with-modules run',
# not stock golangci-lint.
version: "2"
run:
  modules-download-mode: vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - asasalint                 # check for pass []any as any in variadic func(...any)
    - asciicheck                # ensure code does not contain non-ASCII identifiers
    - azproviderlint            # custom azurerm provider checks (AZR/AZS/AZT), module plugin - see scripts/.custom-gcl.yml
    - bidichk                   # checks for dangerous unicode character sequences
    - copyloopvar               # detects redundant x := x copies of loop variables (unnecessary since Go 1.22)
    - decorder                  # check declaration order and count of types, constants, variables and functions
    - dupword                   # check for duplicated words in comments
    - durationcheck             # check for common mistakes when working with time.Duration
    - errcheck                  # checking for unchecked errors
    - errname                   # checks sentinel errors are named ErrFoo and error types FooError
    - fatcontext                # detects nested contexts accidentally rebuilt in loops and function literals
    - gocheckcompilerdirectives # checks //go: compiler directive comments are valid
    - gocritic                  # linter for Go source code that specializes in simplifying code
    - govet                     # reports suspicious constructs, roughly the same as 'go vet'
    - ineffassign               # detects when assignments to existing variables are not used
    - makezero                  # finds slices created with non-zero length that are later appended to (leaving zero-value elements)
    - mirror                    # reports mismatched bytes/strings function pairs causing needless conversions
    - misspell                  # finds commonly misspelled English words
    - nilerr                    # finds code that returns nil after it checks that the error is not nil
    - nilnesserr                # finds code that checks one error but mistakenly returns a different nil error
    - noctx                     # finds http requests and exec commands made without a context.Context
    - nosprintfhostport         # checks for misuse of Sprintf to construct host:port in a URL
    - predeclared               # find code that shadows one of Go's predeclared identifiers
    - reassign                  # checks that package variables are not reassigned
    - staticcheck               # checks rules from staticcheck (not the same thing as the staticcheck binary)
    - tagalign                  # checks struct tags are aligned and sorted (json/tfschema/computed first, per settings below)
    - tfproviderlint            # terraform provider checks (AT/R/S/V + extended X*), module plugin - see scripts/.custom-gcl.yml
    - unconvert                 # checks for unnecessary type conversions
    - unparam                   # reports unused function parameters
    - unused                    # checks Go code for unused constants, variables, functions and types
    - wastedassign              # finds wasted assignment statements
    - whitespace                # checks for unnecessary newlines at the start and end of functions, if, for, etc.

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor$
      - internal/services/.*/.*_gen.go$
      - /sdk/
      - third_party$
      - builtin$
      - examples$

  settings:
    errcheck:
      exclude-functions: # d.Set/SetNew/ForceNew only error on schema-key typos (caught by tests)
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).ForceNew
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNew
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNewComputed
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
        - io.Close
    govet:
      enable:
        - nilness # reports impossible/redundant nil comparisons and nil pointer dereferences
    misspell:
      ignore-rules:
        - hdinsight
        - exportfs
    predeclared:
      ignore: # widely used as ordinary variable/parameter names across the provider (old/new in diffs, min/max in validation)
        - new
        - min
        - max
    tagalign:
      sort: true # fixed order below first, any remaining tags alphabetically after
      order:
        - json
        - tfschema
        - computed

    custom:
      azproviderlint:
        type: module
        settings:
          disable:
            - AZR002 # splite create and udpate: ~350 todo over time
            - AZT002 # tests should not obtain credentials via os.Getenv - investigate in a later pr
            - AZR004 # Resource IDs should not be compared with == or != - to fix in a later commit
            - AZR003 # d.Get should not be used within a Delete function as it does not work as expected during deletion - 9 findings to fix later
            - AZR007 # StateChangeConf should be replaced with a custom poller implementing pollers.PollerType - 159 findings, being migrated over time (eventual consistency poller series was the start)
            - AZS003 # TypeList blocks where every property is optional with no default allow empty blocks - 290 findings to fix later
            - AZS005 # resources with no corresponding data source - 768 findings, to determine if to be fixed later
            - AZS006 # data sources missing properties that exist on the resource - 185 findings, todo later
          AZG002:
            use: pointer.To # rather than the go1.26 new(<expr>) builtin
          AZG006:
            # only inline temporaries into calls whose other arguments are all basic literals
            # (e.g. d.Set("key", x)) - among identifier/expression siblings the name adds context
            only-when-literals: true
          AZS004:
            # exact-match only: report hand-written lists that exactly match the enum (a pure
            # PossibleValuesFor<Enum>() swap); deliberate subsets/supersets are left alone
            allow-missing-values: true
            allow-extra-values: true
          AZS007:
            exclude-packages: "migration"
      tfproviderlint:
        type: module
        settings: # all checks run (including the tfproviderlintx X* checks, via extended) except those disabled below
          extended: true
          disable:
            - AT002 # flags ImportState tests as extraneous, but azurerm intentionally has separate _requiresImport acceptance tests
            - AT004 # flags TestStep Configs declaring provider blocks, but azurerm test configs intentionally declare provider "azurerm" { features {} }
            - R009 # avoid panic() — 27 findings, mostly intentional panics in internal/tools generators and the internal/acceptance test framework
            - R018 # prefer retry/wait helpers over time.Sleep() — 28 findings, many deliberate PreConfig waits in acceptance tests
            - XR005 # resources should configure Description — azurerm does not use schema descriptions (docs are hand-written)
            - XR008 # avoid os/exec.CommandContext() — intentional uses in the internal/tools generators, and noctx requires CommandContext over Command
            - XS001 # schema attributes should configure Description — azurerm does not use schema descriptions (docs are hand-written)
            - XS002 # schema attributes should be listed alphabetically — azurerm orders schemas required/optional/computed by convention
          flags:
            - check: AT001 # TestCases should define CheckDestroy, check only ignores the data_source_ prefix by default and azurerm suffixes their tests
              flag: ignored-filename-suffixes
              value: _data_source_test.go
            - check: R006 # RetryFunc bodies should contain a RetryableError - teach the check azurerm's pluginsdk alias for helper/resource
              flag: package-aliases
              value: pluginsdk

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci: # gci enforces canonical import sections (goimports alone preserves existing groups)
      sections:
        - standard
        - blank
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - vendor$
      - internal/services/.*/.*_gen.go$
      - /sdk/
      - third_party$
      - builtin$
      - examples$
