# Copyright IBM Corp. 2014, 2025
# "SPDX-License-Identifier: MPL-2.0"

# Copyright header config for copyplop (https://github.com/YakDriver/copyplop), enforced by
# 'make copyright' in CI - run 'make copyright-fix' to add/update headers. Keep header_ignore
# in .copywrite.hcl (used by the IBM compliance scanner) in sync with exclude_paths below.
copyright:
  holder: "IBM Corp."
  start_year: 2014
  current_year: 2025
  format: "Copyright {{.Holder}} {{.StartYear}}, {{.CurrentYear}}"

license:
  enabled: true
  identifier: "MPL-2.0"
  format: "SPDX-License-Identifier: {{.Identifier}}"

files:
  exclude_paths:
    - ".ci/**"
    - ".github/**"
    - ".idea/**"
    - ".release/**"
    - ".teamcity/**"
    - "vendor/**"
    - "internal/**/*_gen.go" # pandora generated files
    - ".goreleaser.yml"
  extensions: # markdown/json/templates are deliberately excluded, matching the compliance scanner
    - ".go"
    - ".hcl"
    - ".ps1"
    - ".py"
    - ".sh"
    - ".tf"
    - ".xml"
    - ".yaml"
    - ".yml"
  comment_styles:
    go: "//"
    hcl: "#"
    ps1: "#"
    py: "#"
    sh: "#"
    tf: "#"
    xml: "<!--"
    yaml: "#"
    yml: "#"
  placement_exceptions:
    xml_declaration: true

detection:
  skip_generated: false
  generated_patterns:
    - "Code generated"
    - "DO NOT EDIT"
  replace_patterns: # pre-acquisition headers are rewritten rather than treated as third-party
    - "Copyright.*HashiCorp"
    - "Copyright \\(c\\).*HashiCorp"
  max_scan_lines: 20

third_party:
  action: "above"
  patterns:
    - "Copyright.*[a-zA-Z0-9].*"
