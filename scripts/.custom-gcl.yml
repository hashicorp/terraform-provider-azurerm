# 'golangci-lint custom' requires 'version:' inline here; it MUST match the
# 'golangci-lint-version' marker in the root .golangci.yml (the source of truth all other
# places derive from) - 'make golangci-with-modules' fails the build on a mismatch.
version: v2.12.2
name: golangci-with-modules
plugins:
  - module: "github.com/katbyte/azproviderlint"
    import: "github.com/katbyte/azproviderlint/plugin"
    version: v0.1.0
  - module: "github.com/katbyte/tfproviderlint-golangci"
    import: "github.com/katbyte/tfproviderlint-golangci/plugin"
    version: v0.31.0
